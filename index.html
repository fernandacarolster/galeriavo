<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Virtual - Galáxia</title>
    <!-- Carregando o A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Estilo do Modal Overlay para exibir a obra em tela cheia */
        #art-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 15, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #art-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #art-overlay img {
            max-width: 80vw;
            max-height: 70vh;
            border: 2px solid #6c5ce7;
            box-shadow: 0 0 40px rgba(108, 92, 231, 0.4);
            border-radius: 8px;
            object-fit: contain;
        }

        #art-overlay h2 {
            color: #dfe6e9;
            margin-top: 20px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.2rem;
        }

        #art-overlay button {
            margin-top: 25px;
            padding: 10px 25px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        #art-overlay button:hover {
            background: #a29bfe;
        }

        /* Instruções na tela inicial */
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 30, 0.8);
            color: #b2bec3;
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #636e72;
            font-size: 0.9rem;
            z-index: 10;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Instruções de navegação -->
    <div id="instructions">Use as setas do teclado ou W/A/S/D para mover • Mouse para olhar • Clique na obra para ampliar</div>

    <!-- Modal Overlay -->
    <div id="art-overlay">
        <img id="overlay-img" src="" alt="Obra Ampliada">
        <h2 id="overlay-title">Título da Obra</h2>
        <button onclick="closeOverlay()">Fechar</button>
    </div>

    <!-- Cena A-Frame -->
    <a-scene background="color: #020208">
        
        <!-- Ativos (Imagens das Obras) -->
        <a-assets>
            <!-- Substitua os links abaixo pelas URLs das suas imagens -->
            <img id="obra1" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop">
            <img id="obra2" src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?q=80&w=1000&auto=format&fit=crop">
            <img id="obra3" src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=1000&auto=format&fit=crop">
        </a-assets>

        <!-- Iluminação Cósmica / Atmosfera -->
        <a-light type="ambient" color="#1a1a3a" intensity="1.2"></a-light>
        <a-light type="point" position="0 8 0" color="#a29bfe" intensity="2" distance="30"></a-light>

        <!-- Fundo de Galáxia / Estrelas (Esfera invertida com partículas/cor estelar) -->
        <a-sky color="#05050f" radius="100"></a-sky>
        
        <!-- Pequenas estrelas geradas ao redor -->
        <a-entity position="0 0 0">
            <a-sphere position="20 15 -30" radius="0.2" color="#ffffff" material="shader: flat"></a-sphere>
            <a-sphere position="-25 10 -20" radius="0.15" color="#74b9ff" material="shader: flat"></a-sphere>
            <a-sphere position="15 -10 -25" radius="0.1" color="#fd79a8" material="shader: flat"></a-sphere>
            <a-sphere position="-18 -15 -35" radius="0.25" color="#ffeaa7" material="shader: flat"></a-sphere>
            <a-sphere position="30 -5 15" radius="0.15" color="#ffffff" material="shader: flat"></a-sphere>
            <a-sphere position="-30 8 20" radius="0.2" color="#74b9ff" material="shader: flat"></a-sphere>
        </a-entity>

        <!-- Piso Flutuante com brilho sutil -->
        <a-circle position="0 0 0" rotation="-90 0 0" radius="15" color="#0b0b16" roughness="0.2" metalness="0.8"></a-circle>
        <!-- Anel decorativo de energia no chão -->
        <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="10" radius-outer="10.2" color="#6c5ce7" material="shader: flat; opacity: 0.5"></a-ring>

        <!-- Obra Central (Frente) -->
        <a-entity position="0 2.5 -6">
            <!-- Moldura -->
            <a-box width="3.2" height="2.2" depth="0.1" color="#2d3436" roughness="0.5">
                <!-- Imagem da Obra com comportamento interativo -->
                <a-plane src="#obra1" width="3" height="2" position="0 0 0.06" 
                         class="clickable" 
                         open-overlay="title: Nebulosa Primordial; img: #obra1">
                </a-plane>
            </a-box>
            <!-- Placa de identificação -->
            <a-text value="Nebulosa Primordial" position="0 -1.3 0.06" align="center" width="4" color="#b2bec3"></a-text>
        </a-entity>

        <!-- Obra Esquerda -->
        <a-entity position="-5 2.5 -3" rotation="0 45 0">
            <a-box width="3.2" height="2.2" depth="0.1" color="#2d3436" roughness="0.5">
                <a-plane src="#obra2" width="3" height="2" position="0 0 0.06" 
                         class="clickable" 
                         open-overlay="title: Horizonte de Eventos; img: #obra2">
                </a-plane>
            </a-box>
            <a-text value="Horizonte de Eventos" position="0 -1.3 0.06" align="center" width="4" color="#b2bec3"></a-text>
        </a-entity>

        <!-- Obra Direita -->
        <a-entity position="5 2.5 -3" rotation="0 -45 0">
            <a-box width="3.2" height="2.2" depth="0.1" color="#2d3436" roughness="0.5">
                <a-plane src="#obra3" width="3" height="2" position="0 0 0.06" 
                         class="clickable" 
                         open-overlay="title: Matéria Escura; img: #obra3">
                </a-plane>
            </a-box>
            <a-text value="Matéria Escura" position="0 -1.3 0.06" align="center" width="4" color="#b2bec3"></a-text>
        </a-entity>

        <!-- Câmera com Cursor / Raycaster para interação por clique -->
        <a-entity position="0 1.6 4">
            <a-camera look-controls wasd-controls>
                <a-cursor 
                    raycaster="objects: .clickable" 
                    fuse="false" 
                    material="color: #a29bfe; shader: flat"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015">
                </a-cursor>
            </a-camera>
        </a-entity>

    </a-scene>

    <!-- Script de Componente A-Frame e Lógica do Overlay -->
    <script>
        // Componente personalizado para registrar o clique na obra e abrir o overlay
        AFRAME.registerComponent('open-overlay', {
            schema: {
                title: {type: 'string', default: 'Obra de Arte'},
                img: {type: 'selector'}
            },
            init: function () {
                var data = this.data;
                var el = this.el;

                el.addEventListener('click', function () {
                    const overlay = document.getElementById('art-overlay');
                    const overlayImg = document.getElementById('overlay-img');
                    const overlayTitle = document.getElementById('overlay-title');

                    // Define a fonte da imagem e o título com base nos atributos passados
                    overlayImg.src = data.img.src;
                    overlayTitle.textContent = data.title;

                    // Mostra o overlay
                    overlay.classList.add('active');
                });
            }
        });

        // Função para fechar o overlay
        function closeOverlay() {
            const overlay = document.getElementById('art-overlay');
            overlay.classList.remove('active');
        }
    </script>
</body>
</html>
